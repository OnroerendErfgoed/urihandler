name: urihandler backend tests

on:
  workflow_dispatch:

  pull_request:
    paths:
      - urihandler/**
      - .github/workflows/urihandler.yaml
      - scripts/**
      - pyproject.toml
      - requirements*.txt
      - tests/**

  push:
    branches:
      - main
env:
  PYTHON_VERSION: '3.11'
  PYTHON_VENV: 'urihandler_venv'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install python requirements
        env:
          HATCH_BUILD_NO_HOOKS: true
        working-directory: ./
        run: |
          python -m venv ${{ env.PYTHON_VENV }}
          source ${{ env.PYTHON_VENV }}/bin/activate
          pip --version
          pip install pip-tools
          pip-sync requirements-dev.txt
          pip install -e .

      - name: Python tests
        run: |
          source ${{ env.PYTHON_VENV }}/bin/activate
          flake8
          pytest --cov-report xml:${{ runner.temp }}/coverage.xml --cov=oproeppremieaanvragen tests

      - name: Get Cover
        uses: orgoro/coverage@v3.2
        with:
            coverageFile: ${{ runner.temp }}/coverage.xml
            token: ${{ secrets.GITHUB_TOKEN }}
          
